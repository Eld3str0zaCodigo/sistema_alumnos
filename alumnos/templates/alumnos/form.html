{% extends 'base.html' %}

{% block title %}{% if object %}Editar{% else %}Crear{% endif %} Alumno{% endblock %}

{% block content %}
<h2>{% if object %}Editar{% else %}Crear{% endif %} Alumno</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'alumno_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
