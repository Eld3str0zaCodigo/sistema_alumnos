{% extends 'base.html' %}

{% block title %}Eliminar Alumno{% endblock %}

{% block content %}
<h2>¿Estás seguro de que quieres eliminar a {{ object.nombres }} {{ object.apellidos }}?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'alumno_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
