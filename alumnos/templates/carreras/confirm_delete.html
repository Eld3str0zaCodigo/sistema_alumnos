{% extends 'base.html' %}

{% block title %}Eliminar Carrera{% endblock %}

{% block content %}
<h2>¿Estás seguro de que quieres eliminar la carrera "{{ object.nombre }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'carrera_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
